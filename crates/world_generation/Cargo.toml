[package]
name = "world_generation"
version = "0.1.0"
edition = "2024"
description = "Decode world placement JSON, expand layouts, and spawn Bevy entities"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["serialize"] }
log = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
