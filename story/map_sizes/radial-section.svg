<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="title desc">
  <title id="title">Radial section along Burrow axis to Hedgerow seam</title>
  <desc id="desc">Section along the Burrow strip under Mid and Outer, across Outshire to the Hedgerow seam entry. Hang depth 80-120 m.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #1a1c1a; }
      .ground { stroke: #6a7068; stroke-width: 2; }
      .core { fill: #4a5058; stroke: #c4b48a; stroke-width: 1.5; }
      .inner { fill: #3a4048; stroke: #9aa4ac; stroke-width: 1; }
      .mid { fill: #323840; stroke: #8a96a0; stroke-width: 1; }
      .outer { fill: #2c3238; stroke: #7a8894; stroke-width: 1; }
      .outshire { fill: #3d3428; stroke: #a8894a; stroke-width: 1.5; }
      .hedge { fill: #2a3328; stroke: #5a6b52; stroke-width: 1.5; }
      .burrow { fill: #2a2418; stroke: #c4a060; stroke-width: 1.5; }
      .strut { stroke: #8a7a5a; stroke-width: 1; }
      .tick { stroke: #d8c89a; stroke-width: 1; }
      .axis { stroke: #d8c89a; stroke-width: 1; }
      .vdim { stroke: #c4a060; stroke-width: 1; }
      .label-sm { fill: #b8b0a0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 9px; }
      .title { fill: #e8e0d0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
      .dim { fill: #d8c89a; font-family: "IBM Plex Mono", "Consolas", monospace; font-size: 10px; }
      .burrow-dim { fill: #c4a060; font-family: "IBM Plex Mono", "Consolas", monospace; font-size: 9px; }
      .mute { fill: #6a7068; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 9px; }
    ]]></style>
  </defs>

  <rect class="bg" width="700" height="360"/>

  <text class="title" x="24" y="28">Section along Burrow axis (to Hedgerow seam)</text>
  <text class="label-sm" x="24" y="46">40 px / km | Burrow meets seam at 12.5 km | Hedgerow only 1 km deep | runs spawn in Cell</text>

  <rect class="core" x="40" y="60" width="32" height="100"/>
  <rect class="inner" x="72" y="80" width="68" height="80"/>
  <rect class="mid" x="140" y="90" width="120" height="70"/>
  <rect class="outer" x="260" y="100" width="180" height="60"/>
  <rect class="outshire" x="440" y="115" width="100" height="45"/>
  <rect class="hedge" x="540" y="125" width="40" height="35"/>

  <line class="ground" x1="40" y1="160" x2="580" y2="160"/>
  <text class="mute" x="590" y="164">unmapped</text>

  <!-- Burrow 2.5 km (x140) to 12.5 km (x540) -->
  <rect class="burrow" x="140" y="175" width="400" height="50"/>
  <line x1="440" y1="175" x2="440" y2="225" stroke="#e0c070" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="540" y1="160" x2="540" y2="225" stroke="#e0c070" stroke-width="1.5"/>
  <g class="strut">
    <line x1="170" y1="160" x2="170" y2="225"/>
    <line x1="220" y1="160" x2="220" y2="225"/>
    <line x1="280" y1="160" x2="280" y2="225"/>
    <line x1="340" y1="160" x2="340" y2="225"/>
    <line x1="400" y1="160" x2="400" y2="225"/>
    <line x1="490" y1="160" x2="490" y2="225"/>
    <line x1="540" y1="160" x2="540" y2="225"/>
  </g>

  <text class="label-sm" x="280" y="205" text-anchor="middle" fill="#c4a060">Burrow under Mid+Outer</text>
  <text class="label-sm" x="490" y="205" text-anchor="middle" fill="#c4a060">across Outshire</text>
  <text class="label-sm" x="540" y="245" text-anchor="middle" fill="#c4a060">seam entry</text>

  <line class="vdim" x1="555" y1="160" x2="555" y2="225"/>
  <line class="vdim" x1="550" y1="160" x2="560" y2="160"/>
  <line class="vdim" x1="550" y1="225" x2="560" y2="225"/>
  <text class="burrow-dim" x="568" y="198">~80-120 m</text>

  <text class="burrow-dim" x="300" y="265" text-anchor="middle">2.5-10 under rings | 10-12.5 Outshire to seam | 0.5 km wide | 20 deg</text>

  <line class="axis" x1="40" y1="300" x2="580" y2="300"/>
  <g class="tick">
    <line x1="40" y1="294" x2="40" y2="306"/>
    <line x1="72" y1="294" x2="72" y2="306"/>
    <line x1="140" y1="294" x2="140" y2="306"/>
    <line x1="260" y1="294" x2="260" y2="306"/>
    <line x1="440" y1="294" x2="440" y2="306"/>
    <line x1="540" y1="294" x2="540" y2="306"/>
    <line x1="580" y1="294" x2="580" y2="306"/>
  </g>

  <text class="dim" x="40" y="322" text-anchor="middle">0</text>
  <text class="dim" x="72" y="322" text-anchor="middle">0.8</text>
  <text class="dim" x="140" y="322" text-anchor="middle">2.5</text>
  <text class="dim" x="260" y="322" text-anchor="middle">5.5</text>
  <text class="dim" x="440" y="322" text-anchor="middle">10</text>
  <text class="dim" x="540" y="322" text-anchor="middle">12.5</text>
  <text class="dim" x="580" y="322" text-anchor="middle">13.5</text>

  <text class="label-sm" x="56" y="52" text-anchor="middle">CIBoT</text>
  <text class="label-sm" x="106" y="72" text-anchor="middle">Inner</text>
  <text class="label-sm" x="200" y="82" text-anchor="middle">Mid</text>
  <text class="label-sm" x="350" y="92" text-anchor="middle">Outer</text>
  <text class="label-sm" x="490" y="108" text-anchor="middle">Outshire</text>
  <text class="label-sm" x="560" y="118" text-anchor="middle">Hedge</text>
</svg>
